[project]
name = "school-ms"
version = "0.1.0"
description = "AI-augmented school management system for a 550-student MSBSHSE school (synthetic data)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "pandas>=2.0",
    "numpy>=1.26",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
