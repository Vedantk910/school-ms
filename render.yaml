# Render Blueprint — School-MS API.
#
# Deploy: render.com → New → Blueprint → pick repo Vedantk910/school-ms
# (branch main) → Deploy Blueprint. Render reads this file from the root.
#
# Source-based Python runtime (no Docker): Render installs requirements and
# runs uvicorn directly. The database is NOT created here — this reuses the
# existing Neon Postgres (already migrated + seeded).

services:
  - type: web
    name: school-ms-api
    runtime: python
    plan: free                 # free sleeps after ~15 min idle; use "starter" for always-on
    buildCommand: cd backend && pip install --no-cache-dir -r requirements.txt
    startCommand: cd backend && mkdir -p artifacts && uvicorn app.main:app --host 0.0.0.0 --port ${PORT}
    healthCheckPath: /healthz  # matches GET /healthz in backend/app/main.py
    envVars:
      # Required — Render prompts for the value at deploy. The seeded Neon
      # Postgres pooler URL with the +psycopg scheme (kept out of git).
      - key: SCHOOLMS_DATABASE_URL
        sync: false
      # Random 256-bit secret generated by Render at deploy.
      - key: SCHOOLMS_JWT_SECRET
        generateValue: true
      - key: SCHOOLMS_CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://vedantk910.github.io,https://frontend-eta-two-66.vercel.app,https://school-ms.vedantk910s-projects.vercel.app"
      - key: SCHOOLMS_LLM_BACKEND
        value: "demo"
      - key: SCHOOLMS_COMMS_BACKEND
        value: "log"
      - key: PYTHONUNBUFFERED
        value: "1"
